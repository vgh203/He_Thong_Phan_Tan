<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form - Latency Hiding</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f4f9; }
        .container { background: #fff; padding: 20px 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="email"], input[type="password"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn { width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 10px; }
        .btn:hover { background-color: #218838; }
        .toggle-group { margin-bottom: 20px; padding: 10px; background-color: #e9ecef; border-radius: 4px; display: flex; align-items: center; justify-content: space-between; }
        #message { margin-top: 15px; padding: 10px; border-radius: 4px; display: none; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .loader { display: none; border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 20px; height: 20px; animation: spin 2s linear infinite; margin: 10px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <h2>Registration</h2>
    
    <div class="toggle-group">
        <label for="localValidation" style="margin: 0;">Enable Local Validation (Task 2)</label>
        <input type="checkbox" id="localValidation">
    </div>

    <form id="registrationForm">
        <div class="form-group">
            <label for="username">Username (min 5 chars)</label>
            <input type="text" id="username" name="username">
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email">
        </div>
        <div class="form-group">
            <label for="password">Password (min 8 chars)</label>
            <input type="password" id="password" name="password">
        </div>
        <button type="submit" class="btn">Register</button>
    </form>
    
    <div class="loader" id="loader"></div>
    <div id="message"></div>
</div>

<script>
    document.getElementById('registrationForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const username = document.getElementById('username').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const useLocalValidation = document.getElementById('localValidation').checked;
        const messageDiv = document.getElementById('message');
        const loader = document.getElementById('loader');
        
        messageDiv.style.display = 'none';
        messageDiv.innerHTML = '';
        messageDiv.className = '';
        
        let startTime = performance.now();
        
        // Task 2: Local Validation
        if (useLocalValidation) {
            let errors = [];
            if (username.length < 5) errors.push("Username must be at least 5 characters long.");
            if (!email.includes('@') || !email.includes('.')) errors.push("Invalid email address format.");
            if (password.length < 8) errors.push("Password must be at least 8 characters long.");
            
            if (errors.length > 0) {
                let endTime = performance.now();
                let timeTaken = (endTime - startTime).toFixed(2);
                
                messageDiv.className = 'error';
                messageDiv.innerHTML = `<strong>Local Validation Failed (Time: ${timeTaken} ms):</strong><br>` + errors.join('<br>');
                messageDiv.style.display = 'block';
                return;
            }
        }
        
        // Task 1: Server-side Validation
        loader.style.display = 'block';
        fetch('/register', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ username, email, password })
        })
        .then(response => response.json())
        .then(data => {
            loader.style.display = 'none';
            let endTime = performance.now();
            let timeTaken = (endTime - startTime).toFixed(2);
            
            if (data.success) {
                messageDiv.className = 'success';
                messageDiv.innerHTML = `<strong>Success (Time: ${timeTaken} ms):</strong><br>${data.message}`;
            } else {
                messageDiv.className = 'error';
                messageDiv.innerHTML = `<strong>Server Validation Failed (Time: ${timeTaken} ms):</strong><br>` + data.errors.join('<br>');
            }
            messageDiv.style.display = 'block';
        })
        .catch(err => {
            loader.style.display = 'none';
            messageDiv.className = 'error';
            messageDiv.innerText = "Network error.";
            messageDiv.style.display = 'block';
        });
    });
</script>
</body>
</html>
